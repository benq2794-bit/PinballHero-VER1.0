<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boss 特效透明底預覽</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#07131d;color:#eaf4fa;font:14px/1.5 system-ui,"Microsoft JhengHei",sans-serif}
h1{margin:0 0 6px;font-size:20px}p{margin:0 0 16px;color:#a9bdc9}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
article{overflow:hidden;border:1px solid #426176;border-radius:10px;background:linear-gradient(145deg,#122838,#08131d);box-shadow:0 8px 20px #0008}
h2{margin:0;padding:9px 12px;border-bottom:1px solid #38566a;font-size:14px}
.stage{height:230px;display:grid;place-items:center;overflow:hidden;background-image:linear-gradient(#07131d55,#07131d55),url('../../battle/bg/gate_fire_crystal_v2.png');background-position:center 52%;background-size:cover}
img{display:block;max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:screen;filter:brightness(1.45) saturate(1.08)}
.summon{width:95%;opacity:.88}.shockwave{width:95%;opacity:.82}.berserk{width:90%;opacity:.68}
small{display:block;padding:8px 12px;color:#a9bdc9}
</style>
<h1>Boss 特效透明底預覽</h1>
<p>三個動畫已清除黑色底幕並保留透明邊緣；套在迴廊火場背景檢視，沒有矩形遮罩。</p>
<main>
  <article><h2>召喚法陣</h2><div class="stage"><img class="summon" src="summon-circle-transparent.webp" alt="召喚法陣"></div><small>透明動畫 WebP・亮度 145%・不透明度 88%</small></article>
  <article><h2>震開衝擊波</h2><div class="stage"><img class="shockwave" src="summon-shockwave-transparent.webp" alt="召喚衝擊波"></div><small>透明動畫 WebP・亮度 145%・不透明度 82%</small></article>
  <article><h2>狂暴氣場</h2><div class="stage"><img class="berserk" src="berserk-aura-transparent.webp" alt="狂暴氣場"></div><small>透明動畫 WebP・亮度 145%・不透明度 68%</small></article>
</main>
</html>
